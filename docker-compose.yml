version: '3.8'
services:
  gradio:
    build: .
    ports:
      - "7860:7860"
    volumes:
      - ./:/app:cached
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
    restart: unless-stopped
version: '3.8'
services:
  app:
    build: .
    ports:
      - "7860:7860"
    volumes:
      - ./:/app
    environment:
      - PYTHONUNBUFFERED=1
    command: python gradio_app.py
